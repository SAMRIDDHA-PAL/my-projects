let cur=[],curKey="";
function getSel(n){return document.querySelector(`input[name="${n}"]:checked`).value}
function go2(){document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');}
function go3(){
const lang=getSel('lang'),cat=getSel('cat'),key=lang+"-"+cat;curKey=key;cur=DB[key]||[];
document.getElementById('s2').classList.add('hidden');document.getElementById('s3').classList.remove('hidden');
document.getElementById('rt').innerText=lang+" "+cat+" List";document.getElementById('rc').innerText=cur.length+" titles - A-Z - 1,2,3...";
render(cur);
}
function render(list){
let html="";for(let i=0;i<list.length;i++){let x=list[i];let meta="";
if(curKey.includes("Book")) meta=`Author: ${x.a}<br>Genre: ${x.g}`;
else if(curKey.includes("Movie")) meta=`Director: ${x.d}<br>Cast: ${x.c}<br>Genre: ${x.g}`;
else meta=`Singer: ${x.s}<br>Album/Movie: ${x.al}<br>Mood: ${x.m}`;
html+=`<div class="item"><div><div class="item-title"><span class="num">${i+1}.</span>${x.t}</div><div class="item-meta">${meta}</div></div><div class="stars">★ ${x.r}</div></div>`;
}document.getElementById('list').innerHTML=html;
}
function doSearch(){let q=document.getElementById('q').value.toLowerCase();if(!q){render(cur);return;}let f=cur.filter(x=> (x.t+" "+(x.a||x.d||x.s||"")).toLowerCase().includes(q));render(f);document.getElementById('rc').innerText=f.length+" found";}
